name: Build Debug APK

on:
  # main 只同步上游；自定义开发分支推送后自动构建并发布开发版 Release。
  push:
    branches:
      - my-changes
  pull_request:
    branches:
      - my-changes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      update_log: ${{ steps.metadata.outputs.update_log }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release metadata
        id: metadata
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          VERSION="$(date -d '8 hour' -u +3.%y.%m%d%H)"
          SHORT_SHA="${EVENT_SHA:0:7}"
          BASE_SHA="$EVENT_BEFORE"
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=beta-${VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          LOG_DELIMITER="UPDATE_LOG_${EVENT_SHA}"
          {
            echo "update_log<<${LOG_DELIMITER}"
            COMMITS="$(git rev-list --reverse --no-merges "${BASE_SHA}..${EVENT_SHA}")"
            for CATEGORY in "功能更新" "问题修复" "重构与优化" "文档" "测试" "构建与发布" "其他"; do
              CATEGORY_HAS_COMMITS=false
              while IFS= read -r COMMIT; do
                [[ -z "$COMMIT" ]] && continue
                SUBJECT="$(git log -1 --format=%s "$COMMIT")"
                case "$SUBJECT" in
                  feat*|新增*|添加*) COMMIT_CATEGORY="功能更新" ;;
                  fix*|修复*|bug*) COMMIT_CATEGORY="问题修复" ;;
                  refactor*|优化*|重构*) COMMIT_CATEGORY="重构与优化" ;;
                  docs*|文档*) COMMIT_CATEGORY="文档" ;;
                  test*|测试*) COMMIT_CATEGORY="测试" ;;
                  ci*|构建*|发布*) COMMIT_CATEGORY="构建与发布" ;;
                  *) COMMIT_CATEGORY="其他" ;;
                esac
                [[ "$COMMIT_CATEGORY" == "$CATEGORY" ]] || continue

                if [[ "$CATEGORY_HAS_COMMITS" == false ]]; then
                  echo "### ${CATEGORY}"
                  CATEGORY_HAS_COMMITS=true
                fi
                echo "- **${SUBJECT}** (\`${COMMIT:0:7}\`)"
                BODY="$(git log -1 --format=%b "$COMMIT")"
                if [[ -n "$BODY" ]]; then
                  printf '%s\n' "$BODY" | sed 's/^/  /'
                fi
                echo "  变更文件："
                git diff-tree --no-commit-id --name-status -r "$COMMIT" | sed 's/^/  - /'
              done <<< "$COMMITS"
            done
            if [[ -z "$COMMITS" ]]; then
              echo "- 本次没有可列出的提交。"
            fi
            echo "${LOG_DELIMITER}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - product: appMax
            variant: AppMaxRelease
            type: release
          - product: appS
            variant: AppSRelease
            type: releaseS
          - product: appLegacy
            variant: AppLegacyRelease
            type: releaseLegacy
          - product: appMax
            variant: AppMaxDebug
            type: debug
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/build/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure version and signing
        shell: bash
        run: |
          sed -i -E "s/^def version = .*/def version = \"${VERSION}\"/" app/build.gradle
          cp "$GITHUB_WORKSPACE/.github/workflows/legado.jks" "$GITHUB_WORKSPACE/app/legado.jks"
          {
            printf '%s\n' 'RELEASE_STORE_FILE=./legado.jks'
            printf '%s\n' 'RELEASE_KEY_ALIAS=legado'
            printf '%s\n' 'RELEASE_STORE_PASSWORD=gedoor_legado'
            printf '%s\n' 'RELEASE_KEY_PASSWORD=gedoor_legado'
          } >> gradle.properties

      - name: Build ${{ matrix.type }} APK
        run: |
          chmod +x gradlew
          ./gradlew assemble${{ matrix.variant }} --build-cache --parallel --daemon

      - name: Rename APK assets
        shell: bash
        run: |
          mkdir -p apk
          while IFS= read -r file; do
            base_name="$(basename "$file" .apk)"
            abi_part="_universal"
            case "$base_name" in
              *_armeabi-v7a) abi_part="_armeabi-v7a" ;;
              *_arm64-v8a) abi_part="_arm64-v8a" ;;
            esac

            case "${{ matrix.type }}" in
              release)
                output_name="legado_测试版_${VERSION}_原包名${abi_part}.apk"
                ;;
              releaseS)
                output_name="legado_正式版_${VERSION}_共存${abi_part}.apk"
                ;;
              releaseLegacy)
                output_name="legado_兼容版_${VERSION}_旧版覆盖${abi_part}.apk"
                ;;
              debug)
                output_name="legado_Debug调试包_${VERSION}${abi_part}.apk"
                ;;
            esac
            cp "$file" "apk/$output_name"
          done < <(find "app/build/outputs/apk/${{ matrix.product }}" -type f -name '*.apk' -print)

          test -n "$(find apk -type f -name '*.apk' -print -quit)"
          find apk -type f -name '*.apk' -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.type }}
          path: apk/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: all_apks
          merge-multiple: true

      - name: Verify APK assets
        shell: bash
        run: |
          find all_apks -type f -name '*.apk' -print
          test -n "$(find all_apks -type f -name '*.apk' -print -quit)"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_UPDATE_LOG: ${{ needs.prepare.outputs.update_log }}
        shell: bash
        run: |
          {
            printf '%s\n' '## 版本说明' ''
            printf '%s\n' '这是 my-changes 开发分支的自动构建版本，包含测试版、兼容版、共存版和调试版。' ''
            printf '%s\n' "- 版本号：${RELEASE_VERSION}" "- 提交：${GITHUB_SHA}" "- 分支：${GITHUB_REF_NAME}" ''
            printf '%s\n' '## 版本类型' ''
            printf '%s\n' '| 类型 | Gradle 变体 | 用途 |' '|------|-------------|------|' '| 测试版 | appMaxRelease | Max 主开发版本 |' '| 共存版 | appSRelease | 与其他版本共存 |' '| 兼容版 | appLegacyRelease | 兼容原版包名 |' '| 调试版 | appMaxDebug | 无混淆，便于调试和收集日志 |' ''
            printf '%s\n' '## 架构说明' ''
            printf '%s\n' 'Release 版本包含 arm64-v8a、armeabi-v7a 和 universal 三种 APK；调试版按项目默认配置生成 universal 通用包。若不确定设备架构，请选择 universal。' ''
            printf '%s\n' '## 更新内容（本次推送的全部提交）' ''
            printf '%s\n' "$RELEASE_UPDATE_LOG" ''
            printf '%s\n' '## Assets' '' 'APK 文件名中的版本类型和 ABI 标识对应上面的说明。'
          } > release-notes.md
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "阅读Max开发版 ${RELEASE_VERSION}" \
            --notes-file release-notes.md \
            --prerelease \
            --latest=false 2>/dev/null || gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "阅读Max开发版 ${RELEASE_VERSION}" \
            --notes-file release-notes.md \
            --prerelease \
            --latest=false
          gh release upload "$RELEASE_TAG" all_apks/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
